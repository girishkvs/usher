name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_edge:
        description: 'Also submit to Edge Add-ons'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The Edge submission polls two asynchronous operations, each for up to fifteen
    # minutes, so this needs far more room than the CI jobs. It is still a cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        run: npm run verify

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./dist/manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Pack
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: usher-package
          path: artifacts/*.zip

      - name: Attach the package to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

      # Skipped unless the three Partner Center secrets are configured. The first
      # submission has to be made by hand, because a product needs to exist before
      # it has an id to publish against.
      - name: Submit to Edge Add-ons
        if: |
          (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_edge) &&
          vars.EDGE_ENABLED == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node scripts/publish-edge.mjs
