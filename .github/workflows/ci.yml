name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: License compliance (allowlist gate)
        run: npm run licenses
      - name: Build
        run: npm run build
      - name: Verify the bundles
        shell: bash
        run: node scripts/check-bundles.mjs

  vscode-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The extension reuses the browser renderer, so the shared dependencies and the
      # type packages it relies on come from the repository root, not from vscode/.
      - name: Install the shared renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: vscode
      - name: Verify
        run: npm run verify
        working-directory: vscode

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Pack
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: usher-unpacked
          path: artifacts/*.zip
